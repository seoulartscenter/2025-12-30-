<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이현직 & 김예은 결혼합니다</title>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700&family=Nanum+Myeongjo:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nanum Gothic', sans-serif; line-height: 1.8; color: #333; background: #f5f5f5; }
        .container { max-width: 500px; margin: 0 auto; background: #fff; }
        section { padding: 40px 25px; text-align: center; border-bottom: 10px solid #f5f5f5; }
        h2 { font-family: 'Nanum Myeongjo', serif; color: #a08c7a; margin-bottom: 25px; font-weight: 700; }
        
        .hero img { width: 100%; display: block; }
        .hero-info { padding: 30px; background: #fafafa; text-align: center; }
        .hero-info h1 { font-family: 'Nanum Myeongjo'; margin-bottom: 10px; }
        
        .parents { border-top: 1px solid #eee; padding-top: 30px; margin-top: 30px; }
        
        .map-container { position: relative; padding-bottom: 75%; height: 0; background: #eee; margin: 20px 0; }
        .map-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .map-buttons { display: flex; gap: 10px; }
        .btn-map { flex: 1; padding: 12px 0; text-align: center; text-decoration: none; border-radius: 6px; font-weight: bold; color: #fff; }
        .naver { background: #03C75A; } .kakao { background: #FEE500; color: #000; }

        /* --- HTML 자체 RSVP 스타일 --- */
        .rsvp-form { text-align: left; background: #fafafa; padding: 20px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .form-radio { margin-right: 10px; }
        .btn-submit {
            display: block; width: 100%; padding: 15px; margin-top: 20px;
            background: #333; color: #fff; border: none; border-radius: 6px;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <section style="padding:0;">
            <img src="Designer-2.png" alt="메인" style="width:100%;">
            <div class="hero-info">
                <h1>이현직 & 김예은</h1>
                <p style="color:#a08c7a; font-weight:bold;">2025년 12월 30일 (화) 오후 12시</p>
            </div>
        </section>

        <section>
            <h2>초대합니다</h2>
            <p style="white-space: pre-wrap;">두 사람이 사랑으로 만나
평생을 함께하는 약속을 하려 합니다.
소중한 분들을 모시고자 하오니
참석하시어 축복해 주시면 감사하겠습니다.</p>
            <div class="parents">
                
                <div style="margin-top:10px;">김주만 · 김아민 의 장녀 김예은</div>
            </div>
        </section>

        <section>
            <h2>오시는 길</h2>
            <p><strong>김포공항</strong><br>탑승동 2번 출구 전용 버스 탑승</p>
            <div class="map-container">
                <iframe src="about:blank" style="background:#eee;"></iframe>
            </div>
            <div class="map-buttons">
                <a href="#" class="btn-map naver" target="_blank">네이버 지도</a>
                <a href="#" class="btn-map kakao" target="_blank">카카오맵</a>
            </div>
        </section>

        <section id="rsvp">
            <h2>참석 여부 전달</h2>
            <p>작성 후 '전송하기'를 누르면<br>문자메시지 앱이 실행됩니다.</p>
            
            <div class="rsvp-form">
                <div class="form-group">
                    <label class="form-label">성함</label>
                    <input type="text" id="name" class="form-input" placeholder="예: 홍길동">
                </div>
                <div class="form-group">
                    <label class="form-label">참석 여부</label>
                    <label><input type="radio" name="attend" value="참석" checked class="form-radio"> 참석합니다</label><br>
                    <label><input type="radio" name="attend" value="불참" class="form-radio"> 마음만 전합니다</label>
                </div>
                <div class="form-group">
                    <label class="form-label">동반 인원 (본인 포함)</label>
                    <select id="count" class="form-input">
                        <option value="1명">1명</option>
                        <option value="2명">2명</option>
                        <option value="3명">3명</option>
                        <option value="4명 이상">4명 이상</option>
                    </select>
                </div>
                
                <button onclick="sendSMS('01080393479')" class="btn-submit">신랑에게 문자 보내기</button>
                <button onclick="sendSMS('01080393479')" class="btn-submit" style="background:#a08c7a; margin-top:10px;">신부에게 문자 보내기</button>
            </div>
        </section>

        <footer style="padding:30px; text-align:center; background:#333; color:#aaa; font-size:13px;">
            Made by 이현직 & 김예은
        </footer>
    </div>

    <script>
        // 문자 메시지 전송 기능
        function sendSMS(phoneNumber) {
            const name = document.getElementById('name').value;
            const attend = document.querySelector('input[name="attend"]:checked').value;
            const count = document.getElementById('count').value;

            if (!name) { alert('성함을 입력해주세요.'); return; }

            const message = `[결혼식 참석 여부]\n이름: ${name}\n참석: ${attend}\n인원: ${count}`;
            // 아이폰/안드로이드 통합 문자 링크
            location.href = `sms:${phoneNumber}${navigator.userAgent.includes('iPhone') ? '&' : '?'}body=${encodeURIComponent(message)}`;
        }
    </script>
</body>
</html>
